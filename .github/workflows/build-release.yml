name: Build, test and release
on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package standalone editor
        run: python3 tools/package_editor.py
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Browser checks
        run: node tools/test_editor.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-screenshots
          path: qa/
  build:
    needs: editor
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build server and Fabric client
        run: gradle build --no-daemon --console=plain
      - name: Test editor data compatibility
        run: node --test editor/editor-core.test.cjs
      - name: Package editor and install bundle
        run: python3 tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: KeranQuests-2.0.0
          path: out/
      - name: Publish new release without modifying existing releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v2.0.0 >/dev/null 2>&1; then
            echo 'v2.0.0 already exists; preserving its assets.'
            exit 0
          fi
          gh release create v2.0.0 out/KeranQuests-2.0.0.jar out/KeranQuests-Client-1.20.1-2.0.0.jar out/KeranQuests-Editor-2.0.0.html out/KeranQuests-Editor-2.0.0.zip out/KeranQuests-2.0.0-bundle.zip out/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'KeranQuests 2.0.0 · 自定义任务终端与剧情编辑器' --notes-file docs-v2/RELEASE.md

