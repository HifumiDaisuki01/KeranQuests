# KeranQuests 2 · 简化配置；旧版 stages / requirements 写法继续支持
id: zhulong
name: '&6一烛燃尽万年冰'
description: '&7从路人口中了解到，深空联合正在调查二十年前突然废弃的科考前哨站——烛龙站。'
icon: quest_ui_main
order: 2
enabled: true
main_quest_limit: 1
side_quest_limit: 3
prerequisites:
  tree_completed_all:
  - tutorial
quests:
  main01:
    name: '&6主线01 · 雪中之烛，冰下之龙'
    weight: 100
    description: '&7好了，我得先找到卡特……'
    on_start:
    - tellraw {player} {"text":"[提示] 去 space 的 npc_kate 区域找卡特。","color":"yellow"}
    on_complete:
    - minecraft:title {player} title {"text":"主线01 完成","color":"gold"}
    - minecraft:title {player} subtitle {"text":"自己想办法到烛龙站","color":"gray"}
    - tellraw {player} {"text":"[结算] 获得 10 个面包。","color":"gold"}
    rewards:
      items:
      - id: minecraft:bread
        amount: 10
    steps:
    - id: find_kate
      name: '&f找到深空联合的负责人卡特'
      enter: space:npc_kate
    - id: talk_to_kate
      name: '&f和卡特对话'
      talk: 卡特
  main02:
    name: '&6主线02 · 抵达烛龙站'
    weight: 99
    hidden: true
    description: '&7想办法抵达烛龙站。'
    on_start:
    - tellraw {player} {"text":"[电台] 目标：烛龙站。自己想办法过去。","color":"yellow"}
    on_complete:
    - tellraw {player} {"text":"[卡特·无线电] 居然活着回来了……来上次的地方找我。","color":"aqua"}
    - tellraw {player} {"text":"[结算] 获得 20 个面包。","color":"gold"}
    rewards:
      items:
      - id: minecraft:bread
        amount: 20
    after:
    - main01
    steps:
    - id: arrive
      name: '&f抵达烛龙站'
      commands_on_complete:
      - tellraw {player} {"text":"[卡特·无线电] 看来你已经到那该死的地方了，现在赶紧滚回来，我们需要商讨下一步计划","color":"aqua"}
      - rad play {player} http://www.keran.cc/voice/main_kate_05.mp3
      - delay 100 | tellraw {player} {"text":"[卡特·无线电] 我已经把撤离坐标通过 Hermes 发给你了，最好别死在路上了，哈哈哈哈哈","color":"aqua"}
      - delay 100 | rad play {player} http://www.keran.cc/voice/main_kate_06.mp3
      enter: snow:zhulongzhan
    - id: recall
      name: '&f快撤'
      wait: 11s
    - id: extract
      name: '&f想办法撤离'
      trigger: zhulong_main02_extracted
  main03:
    name: '&6主线03 · 深入烛龙'
    weight: 98
    hidden: true
    description: '&7把主楼电脑上的数据日志带回来，别惊动机械守卫。'
    failure:
      on_death: true
      time_limit: 1800
      reset_on_fail: WHOLE_QUEST
      fail_cooldown: 1800
      max_kills:
        count: 3
        types:
        - shouwei
    abandon:
      allowed: true
      cooldown: 3600
      message: '&7[卡特] 懦夫……'
      commands:
      - tellraw {player} {"text":"[卡特] 懦夫……","color":"red"}
    on_start:
    - minecraft:title {player} title {"text":"30:00","color":"red"}
    - minecraft:title {player} subtitle {"text":"不可死亡 · 守卫击杀上限 3","color":"gray"}
    - tellraw {player} {"text":"[卡特] 没用的东西……","color":"gray"}
    on_complete:
    - tellraw {player} {"text":"[卡特] 来找我吧。","color":"aqua"}
    - tellraw {player} {"text":"[结算] 获得 40 个面包。","color":"gold"}
    rewards:
      items:
      - id: minecraft:bread
        amount: 40
    after:
    - main01
    - main02
    steps:
    - id: brief
      name: '&f和卡特对话'
      commands_on_complete:
      - oraxen give {player} zhulong_log_drive 1
      talk: 卡特
    - id: get_data
      name: '&f找到数据日志'
      requirements:
      - type: item
        item: zhulong_log_drive
        count: 1
        consume: false
        display: 获取烛龙站数据日志
        description: 在主楼电脑上拿到 zhulong_log_drive
    - id: extract
      name: '&f撤离'
      trigger: zhulong_main03_extracted
  main04:
    name: '&6主线04 · 交差'
    weight: 97
    hidden: true
    description: '&7你找到他要的东西了吗？'
    on_start:
    - tellraw {player} {"text":"[提示] 带着数据日志去找卡特。","color":"yellow"}
    on_complete:
    - minecraft:title {player} title {"text":"主线04 完成","color":"gold"}
    - minecraft:title {player} subtitle {"text":"新的路线已解锁","color":"gray"}
    after:
    - main03
    steps:
    - id: report
      name: '&f向卡特复命'
      talk: 卡特
  main05a:
    name: '&6主线05A · 反击'
    weight: 96
    hidden: true
    exclusive_group: zhulong_final
    exclusive_with:
    - zhulong:main05b
    description: '&7卡特要你一起去把烛龙站里的东西彻底清理掉。'
    prerequisites:
      quest_completed_all:
      - zhulong:main03
      quest_choice: zhulong_final
      choice_value: A
    on_start:
    - tellraw {player} {"text":"[卡特] 明智的选择！现在等着吧，我会找你的。","color":"green"}
    - tellraw {player} {"text":"[提示] 回去找卡特，然后回烛龙站。","color":"yellow"}
    on_complete:
    - tellraw {player} {"text":"[卡特] 干得漂亮。剩下的交给联合。","color":"green"}
    rewards:
      money: 10000
      exp: 1000
    steps:
    - id: brief
      name: '&f与卡特的人一起推进'
      talk: 卡特
    - id: return
      name: '&f返回烛龙站'
      commands_on_complete:
      - tellraw {player} {"text":"[卡特·无线电] 到了？好，等我信号。","color":"aqua"}
      enter: snow:zhulongzhan
  main05b:
    name: '&6主线05B · 打发'
    weight: 95
    hidden: true
    exclusive_group: zhulong_final
    exclusive_with:
    - zhulong:main05a
    description: '&7卡特给了点东西，让你滚蛋。'
    prerequisites:
      quest_completed_all:
      - zhulong:main03
      quest_choice: zhulong_final
      choice_value: B
    on_start:
    - tellraw {player} {"text":"[卡特] ……好吧，你在这等会。","color":"gray"}
    - tellraw {player} {"text":"[提示] 去找卡特领东西。","color":"yellow"}
    on_complete:
    - tellraw {player} {"text":"[卡特] 拿着这些，别让我再看见你。","color":"red"}
    rewards:
      items:
      - id: minecraft:bread
        amount: 5
      - id: minecraft:emerald
        amount: 8
    steps:
    - id: dismiss
      name: '&f拿上东西，走人'
      talk: 卡特
  side01:
    name: '&b支线01 · 材料收集'
    type: SIDE
    weight: 50
    hidden: true
    description: '&7黑市商人主动联系到了我……他让我到 D2 区域找他。'
    on_start:
    - tellraw {player} {"text":"[提示] 到 snow（雪原）的 D2 区域找黑市商人。","color":"yellow"}
    on_complete:
    - tellraw {player} {"text":"[黑市商人] 好！好！不错！拿着，这是给你的。","color":"green"}
    - tellraw {player} {"text":"[结算] 获得 38 个钻石。","color":"gold"}
    rewards:
      items:
      - id: minecraft:diamond
        amount: 38
    after:
    - main01
    - main02
    steps:
    - id: meet
      name: '&f和黑市商人对话'
      talk: 黑市商人
    - id: find_core
      name: '&f找到一个冰芯样本'
      commands_on_complete:
      - tellraw {player} {"text":"[心里话] 黑市商人要的东西找到了……","color":"gray"}
      requirements:
      - type: item
        item: ice_core_sample
        count: 1
        consume: false
        display: 找到冰芯样本
        description: 获取 ice_core_sample
    - id: deliver
      name: '&f交货'
      talk: 黑市商人
  side02:
    name: '&b支线02 · 联合的委托'
    type: SIDE
    weight: 48
    hidden: true
    description: '&7联合还有别的活儿要人干。'
    rewards:
      money: 3000
      exp: 300
    after:
    - main05a
    steps:
    - id: tbd
      name: '&f待定'
      trigger: zhulong_side02_done
  daily01:
    name: '&b循环任务01 · 清扫'
    type: SIDE
    weight: 40
    repeatable: true
    cooldown: 43200
    hidden: true
    description: '&7把烛龙站外围的机械守卫清一清。'
    abandon:
      allowed: true
      cooldown: 300
    rewards:
      money: 4000
      exp: 400
      items:
      - id: minecraft:bread
        amount: 10
    after:
    - main05a
    steps:
    - id: clear
      name: '&f清扫机械守卫'
      requirements:
      - type: mm_kill
        mobs:
        - shouwei
        count: 5
        display: 击杀机械守卫
        description: 击杀 5 个 shouwei
schema: 2
defaults:
  type: MAIN
