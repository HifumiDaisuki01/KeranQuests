# KeranQuests 2 · 简化配置；旧版 stages / requirements 写法继续支持
id: tutorial
name: '&a新手入门'
description: '&7初到废土，先学会活下去。'
icon: quest_ui_main
order: 1
enabled: true
main_quest_limit: 1
side_quest_limit: 3
quests:
  main01:
    name: '&a落脚'
    weight: 100
    on_start:
    - title {player} title {"text":"新手入门","color":"green"}
    - title {player} subtitle {"text":"跟着任务指引走","color":"gray"}
    on_complete:
    - tellraw {player} {"text":"[向导] 你算是入门了。去找接头人吧。","color":"green"}
    rewards:
      money: 500
      exp: 100
      items:
      - id: minecraft:bread
        amount: 8
    steps:
    - id: arrive
      name: '&f抵达新手营地'
      commands_on_complete:
      - tellraw {player} {"text":"[向导] 营地还算安全，先熟悉一下这里。","color":"gray"}
      enter: world:example_tutorial_camp
    - id: talk_guide
      name: '&f与向导对话'
      talk: 示例向导
  jietou:
    name: '&a接头'
    type: SIDE
    weight: 60
    on_complete:
    - tellraw {player} {"text":"[接头人] 暗号对上了。","color":"yellow"}
    rewards:
      money: 800
      exp: 80
    after:
    - main01
    steps:
    - id: find
      name: '&f找到接头人'
      talk: 示例接头人
  xiangfeng:
    name: '&a相逢'
    type: SIDE
    weight: 60
    description: '&7营地的篝火旁传来一阵骚动，

      &7你已经来到了营地，一个熟悉的身影出现了……'
    on_complete:
    - tellraw {player} {"text":"[幸存者] 谢谢你……这个给你。","color":"white"}
    rewards:
      money: 1000
      exp: 120
    after:
    - main01
    steps:
    - id: rescue
      name: '&f救下遇险者'
      description: '&8幸存者被围在废墟里，先清掉周围的怪物，

        &8再上前与他搭话。'
      requirements:
      - type: mm_kill
        mobs:
        - example_wanderer
        count: 5
        display: 击杀示例游荡者
        description: 救下被围困的幸存者
      - type: npc_talk
        npc: 示例幸存者
        display: 与幸存者对话
  diyitongjin:
    name: '&a第一桶金'
    type: SIDE
    weight: 60
    on_complete:
    - tellraw {player} {"text":"[商贩] 成色不错，成交。","color":"gold"}
    rewards:
      money: 2000
      exp: 150
    after:
    - main01
    steps:
    - id: collect
      name: '&f攒够第一笔钱'
      requirements:
      - type: item
        item: scrap_metal
        count: 16
        consume: true
        display: 上交废金属
        description: 从废墟里捡够 16 个废金属
    - id: trade
      name: '&f交给商贩'
      talk: 示例商贩
schema: 2
defaults:
  type: MAIN
