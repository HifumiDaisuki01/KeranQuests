# =============================================================================
#  NPC 对话配置 —— 示例 / 写法标准示范
# =============================================================================
#  作用：玩家右键 Citizens NPC 时，机械式逐条延时播报对白。
#        播完之后自动触发任务里的 npc_talk 要求（不用你手动挂钩）。
#
#  文件位置：plugins/KeranQuests/npc/dialogue.yml
#  改完执行 /kq reload 生效
#
#  ┌─ 字段说明 ──────────────────────────────────────────────────────────┐
#  │ npc            必填。Citizens NPC 的显示名，必须一字不差             │
#  │                （就是游戏里 NPC 头顶显示的那个名字）                 │
#  │ freeze_player  对话期间是否锁住玩家移动（默认 true）                 │
#  │                锁定后玩家不能走动，但可以转视角                      │
#  │ lines          对白列表，按顺序播放                                 │
#  │   delay        延迟多少 tick 后播放这句（20 tick = 1 秒）           │
#  │                注意：delay 是从"对话开始"起算的绝对时间              │
#  │                delay: 0 是立刻，delay: 40 是 2 秒后，以此类推        │
#  │   text         对白内容，支持 & 颜色代码与 {player} 占位符           │
#  │ after          对话全部结束后执行的命令列表                          │
#  │                支持 "delay <tick> | <命令>" 延迟写法                 │
#  └─────────────────────────────────────────────────────────────────────┘
#
#  ⚠ 注意：一个 NPC 只能配一条对话（相同的 npc 名后面的会覆盖前面的）
#
#  小技巧：
#    · 对话结束后玩家要"手动去菜单接下一个任务"—— 这正是设计意图，
#      在 after 里加一句 tellraw 提示玩家输入 /kq 即可
#    · 不想冻结玩家就把 freeze_player 设为 false（比如路边摊贩）
#    · 不写 lines 只有 after 也可以（纯触发型 NPC）
# =============================================================================

dialogues:

  # ---------------------------------------------------------------------------
  #  示例向导 —— 演示：完整演出（冻结玩家 + 标题 + 结尾提示）
  # ---------------------------------------------------------------------------
  guide_intro:
    npc: '示例向导'
    freeze_player: true
    lines:
      - delay: 0
        text: '&7[向导] &f醒了？能站起来就好。'
      - delay: 30
        text: '&7[向导] &f这地方不适合新人，先跟我熟悉一下营地。'
      - delay: 60
        text: '&7[向导] &f记住：活下去比什么都重要。'
      - delay: 100
        text: '&7[向导] &f去吧，任务面板在 &e/kq &f里。'
    after:
      # 对话结束后给一句提示，引导玩家自己去菜单接任务
      - 'tellraw {player} {"text":"[提示] 输入 /kq 打开任务菜单","color":"yellow"}'

  # ---------------------------------------------------------------------------
  #  示例接头人 —— 演示：不冻结玩家（短对话，随说随走）
  # ---------------------------------------------------------------------------
  jietou_talk:
    npc: '示例接头人'
    freeze_player: false
    lines:
      - delay: 0
        text: '&7[接头人] &f风声是"烛龙"。'
      - delay: 25
        text: '&7[接头人] &f暗号对上了。你是自己人。'
      - delay: 55
        text: '&7[接头人] &f别多问，先干活。'

  # ---------------------------------------------------------------------------
  #  示例幸存者 —— 演示：最短的对话（只有两句）
  # ---------------------------------------------------------------------------
  survivor_talk:
    npc: '示例幸存者'
    freeze_player: false
    lines:
      - delay: 0
        text: '&7[幸存者] &f谢、谢谢你……那些人全被拖走了。'
      - delay: 30
        text: '&7[幸存者] &f往北走，别回头。'

  # ---------------------------------------------------------------------------
  #  示例商贩 —— 演示：纯粹的交货 NPC（对话很短）
  # ---------------------------------------------------------------------------
  trader_talk:
    npc: '示例商贩'
    freeze_player: false
    lines:
      - delay: 0
        text: '&7[商贩] &f废金属？我看看成色。'
      - delay: 30
        text: '&7[商贩] &f嗯……能出个价。'

  # ===========================================================================
  #  烛龙探秘 相关的两个 NPC
  # ===========================================================================

  # ---------------------------------------------------------------------------
  #  示例联络员 —— 主线02 阶段三对话用
  #  演示：长演出 + 结尾给抉择提示
  # ---------------------------------------------------------------------------
  liaison_debrief:
    npc: '示例联络员'
    freeze_player: true
    lines:
      - delay: 0
        text: '&7[联络员] &f直升机把你带回来，说明你还算有用。'
      - delay: 40
        text: '&7[联络员] &f烛龙站下面埋着的东西，不该被挖出来。'
      - delay: 80
        text: '&7[联络员] &f但我们得有人去确认。'
      - delay: 120
        text: '&7[联络员] &f你有两个选择：拿着钱走人，或者……继续。'
      - delay: 170
        text: '&7[联络员] &f想清楚。打开 &e/kq &f做决定吧。'
    after:
      - 'tellraw {player} {"text":"[提示] 打开 /kq 查看「抉择」任务","color":"gold"}'
      - 'delay 20 | title {player} title {"text":"抉择","color":"gold"}'

  # ---------------------------------------------------------------------------
  #  示例负责人 —— 主线03B 阶段四对话用
  #  演示：对话结束同时解锁后续内容（标题动画 + 引导）
  # ---------------------------------------------------------------------------
  chief_report:
    npc: '示例负责人'
    freeze_player: true
    lines:
      - delay: 0
        text: '&7[负责人] &f守望者死了。整个站区安静得可怕。'
      - delay: 40
        text: '&7[负责人] &f你知道自己在做什么，这很好。'
      - delay: 80
        text: '&7[负责人] &f从今天起，你算是我们的人了。'
      - delay: 120
        text: '&7[负责人] &f悬赏板会定期更新。去看看。'
    after:
      - 'tellraw {player} {"text":"[提示] 循环任务已解锁，打开 /kq 查看","color":"gold"}'
      - 'delay 20 | title {player} title {"text":"任务线解锁","color":"gold"}'
      - 'delay 20 | title {player} subtitle {"text":"清场 · 循环悬赏","color":"yellow"}'
