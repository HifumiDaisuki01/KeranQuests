# KeranQuests 2 · NPC 对话。可按章节拆为 npc/ 下的多个 yml 文件。
dialogues:
  kate_main01:
    npc: 卡特
    priority: 100
    freeze_player: true
    when:
      quest_active:
      - zhulong:main01
    nodes:
    - say:
        delay: 0
        text: '&7[你] &f你好，我是来……'
        after: 40
    - say:
        delay: 0
        text: '&7[卡特] &f哦？又一个不怕死的老鼠……好！我敬佩你的勇气！'
        run:
        - rad play {player} http://www.keran.cc/radio/main_kate_01.mp3
        after: 60
    - say:
        delay: 0
        text: '&7[卡特] &f所以，你知道你要做的是什么吗？'
        after: 100
    - ask:
        delay: 0
        prompt: '&8▸ &7你可以直接问他（点击下方文字提问）'
        questions:
        - label: 烛龙站是？
          hover: 点击追问
          answer: '&7[卡特] &f你不需要知道这么多。'
          run:
          - rad play {player} http://www.keran.cc/voice/main_kate_02.mp3
          after: 60
        - label: 我会得到什么？
          hover: 点击追问
          answer: '&7[卡特] &f你们这些老鼠最想要的，身份卡。'
          run:
          - rad play {player} http://www.keran.cc/voice/main_kate_03.mp3
          after: 70
        - label: 我没有问题了
          hover: 结束提问，继续
          exit: true
          after: 20
    - say:
        delay: 0
        text: '&7[卡特] &f就这么定了。不过，你这种渣滓不配浪费联合的空运资源，'
        after: 0
    - say:
        delay: 0
        text: '&7[卡特] &f自己想办法到烛龙站，然后联系我。'
        run:
        - rad play {player} http://www.keran.cc/voice/main_kate_04.mp3
        after: 120
  kate_main03:
    npc: 卡特
    priority: 90
    freeze_player: true
    when:
      quest_active:
      - zhulong:main03
    nodes:
    - say:
        delay: 0
        text: '&7[卡特] &f居然活着回来了……好，说明一下情况。'
        after: 40
    - say:
        delay: 0
        text: '&7[卡特] &f我需要烛龙站主楼一台电脑上的烛龙站数据日志，把他找到，带回来。'
        run:
        - rad play {player} http://www.keran.cc/voice/main_kate_07.mp3
        after: 0
    - say:
        delay: 0
        text: '&7[卡特] &f要快，而且别惊动楼里的机械守卫。'
        after: 160
  kate_main04:
    npc: 卡特
    priority: 95
    freeze_player: true
    when:
      quest_active:
      - zhulong:main04
    nodes:
    - say:
        delay: 0
        text: '&7[卡特] &f你找到我要的东西了吗？'
        after: 40
    - choose:
        delay: 0
        prompt: '&8▸ &7你要怎么回答？（点击下方文字）'
        options:
        - label: 说真话，上交数据
          hover: 交出数据日志，进入合作路线
          quest: zhulong:main05a
          choice_group: zhulong_final
          value: A
          require_item: zhulong_log_drive
          require_count: 1
          consume: true
          reply: '&7[卡特] &f明智的选择！现在等着吧，我会找你的。'
          after: 60
          complete_quest: zhulong:main04
        - label: 说假话，没找到
          hover: 保留数据日志，进入另一条路线
          quest: zhulong:main05b
          choice_group: zhulong_final
          value: B
          reply: '&7[卡特] &f……好吧，你在这等会。'
          after: 60
          complete_quest: zhulong:main04
  kate_main05a:
    npc: 卡特
    priority: 88
    freeze_player: true
    when:
      quest_active:
      - zhulong:main05a
    nodes:
    - say:
        delay: 0
        text: '&7[卡特] &f数据我看过了。楼里那东西，得有人去清干净。'
        after: 40
    - say:
        delay: 0
        text: '&7[卡特] &f还杵在这干嘛？回烛龙站待命，等我信号。'
        after: 60
  kate_main05b:
    npc: 卡特
    priority: 87
    freeze_player: true
    when:
      quest_active:
      - zhulong:main05b
    nodes:
    - say:
        delay: 0
        text: '&7[卡特] &f……行吧，没找到就没找到。'
        after: 40
    - say:
        delay: 0
        text: '&7[卡特] &f拿着这些，别让我再看见你。'
        after: 60
  dealer_deliver:
    npc: 黑市商人
    priority: 100
    freeze_player: true
    when:
      quest_active:
      - zhulong:side01
      stage_at_least:
        zhulong:side01: 2
    nodes:
    - say:
        delay: 0
        text: '&7[黑市商人] &f你找到我要的东西了？'
        after: 40
    - choose:
        delay: 0
        prompt: '&8▸ &7（点击下方文字）'
        options:
        - label: 不，还没有
          reply: '&7[黑市商人] &f那还不快滚。'
          after: 20
          end: true
        - label: 拿，给你
          hover: 交出冰芯样本
          require_item: ice_core_sample
          require_count: 1
          consume: true
          reply: '&7[黑市商人] &f好！好！不错！拿着，这是给你的。'
          after: 60
          advance_talk: true
  dealer_brief:
    npc: 黑市商人
    priority: 50
    freeze_player: true
    when:
      quest_active:
      - zhulong:side01
    nodes:
    - say:
        delay: 0
        text: '&7[黑市商人] &f长话短说，我知道你个不要命的最近去了烛龙站。'
        after: 40
    - say:
        delay: 0
        text: '&7[黑市商人] &f我对那边的冰芯样本很眼馋，你要是能给我找一个回来，'
        after: 0
    - say:
        delay: 0
        text: '&7[黑市商人] &f我就给你一大笔钱，ok？快去吧。'
        after: 100
  dealer_default:
    npc: 黑市商人
    priority: 0
    freeze_player: false
    nodes:
    - say:
        delay: 0
        text: '&7[黑市商人] &f看货吗？没货就别挡道。'
        after: 40
  kate_default_a:
    npc: 卡特
    priority: 0
    freeze_player: false
    when:
      choice_made:
        zhulong_final: A
    nodes:
    - say:
        delay: 0
        text: '&7[卡特] &f等着吧，有活儿我会找你。'
        after: 40
  kate_default_b:
    npc: 卡特
    priority: 0
    freeze_player: false
    when:
      choice_made:
        zhulong_final: B
    nodes:
    - say:
        delay: 0
        text: '&7[卡特] &f……你还有脸来？'
        after: 40
  kate_default_none:
    npc: 卡特
    priority: 0
    freeze_player: false
    nodes:
    - say:
        delay: 0
        text: '&7[卡特] &f别烦我，我在忙。'
        after: 40
  guide_intro:
    npc: 示例向导
    freeze_player: true
    lines:
    - delay: 0
      text: '&7[向导] &f醒了？能站起来就好。'
    - delay: 30
      text: '&7[向导] &f这地方不适合新人，先跟我熟悉一下营地。'
    - delay: 60
      text: '&7[向导] &f记住：活下去比什么都重要。'
    - delay: 100
      text: '&7[向导] &f去吧，任务面板在 &e/kq &f里。'
    after:
    - tellraw {player} {"text":"[提示] 输入 /kq 打开任务菜单","color":"yellow"}
