# KeranQuests 2 · auto 优先使用客户端任务终端，legacy 使用旧菜单
storage:
  flush_interval: 60
limits:
  main_quest_limit: 1
  side_quest_limit: 3
placeholders:
  none: 无
region:
  check_interval: 20
dialogue:
  freeze_player: true
  allow_rotate: true
failure_reasons:
  death: 你死亡了
  timeout: 超出时限
  forbidden_region: 进入禁区
  too_many_kills: 击杀数超标
  left_quest_area: 离开了任务区域
  manual: 手动判定失败
messages:
  prefix: '&8[&6任务&8] &r'
  quest_accepted: '&a已接受任务：&f{quest_name}'
  quest_complete_msg: '&a任务完成：&f{quest_name}'
  quest_failed: '&c任务失败：&f{quest_name} &7（{fail_reason}）'
  quest_abandoned: '&7已放弃任务：&f{quest_name}'
  quest_abandon_denied: '&c该任务不允许放弃。'
  cannot_accept_abandon_cooldown: '&c你刚放弃过这个任务，请 &f{time} &c后再来接取。'
  stage_completed: '&e阶段完成：&f{stage_name}'
  cannot_accept_locked: '&c该任务尚未解锁，请先完成前置任务。'
  cannot_accept_cooldown: '&c该任务冷却中，剩余 &f{time}&c。'
  cannot_accept_limit: '&c已达到{type}并发上限（{limit} 个）。'
  cannot_accept_exclusive: '&c你已选择了互斥的另一个分支。'
  tree_terminated: '&c任务树「{tree_name}」已终结，无法再接取任务。'
  tree_locked: '&c该任务线尚未解锁。'
  tree_unlocked: '&a已解锁新的任务线：&f{tree_name}'
  choice_made: '&a你选择了：&f{choice}'
  choice_locked: '&c该抉择已确定，无法更改。'
  not_in_quest_area: '&c你必须先到达任务区域。'
gui:
  title_tree_list: '&8任务树'
  title_quest_list: '&8任务列表 · {tree}'
  title_quest_detail: '&8任务详情 · {quest}'
  title_choice: '&8[!] 抉择 · {title}'
  choice_confirm_ms: 3000
  icons:
    bg: quest_ui_bg
    prev: quest_ui_prev
    next: quest_ui_next
    close: quest_ui_close
    available: quest_ui_available
    active: quest_ui_active
    done: quest_ui_done
    failed: quest_ui_failed
    locked: quest_ui_locked
    unknown: quest_ui_unknown
    cooldown: quest_ui_cooldown
    choice: quest_ui_choice
debug:
  log_completions: true
  show_ids_in_gui: false
ui:
  mode: auto
  require_client: false
