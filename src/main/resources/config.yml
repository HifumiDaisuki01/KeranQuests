# =====================================================================
#  KeranQuests —— 主配置
# =====================================================================

# 存储设置
storage:
  # 每多少秒把脏档案批量写盘（玩家退出时会立即写）
  flush_interval: 60

# 任务并发上限（任务树 yml 里可单独覆盖）
limits:
  # 主线同时只能做一个
  main_quest_limit: 1
  # 支线同时最多三个
  side_quest_limit: 3

# 占位符：没有当前任务时显示什么
placeholders:
  none: '无'

# 区域判定
region:
  # 每秒检测一次玩家所在区域（RegionRunner 的 tick 周期，单位 tick，20=1秒）
  check_interval: 20
  # 玩家移动多少格内不重新查询区域（性能优化）
  cache_radius: 8

# 对话设置
dialogue:
  # 默认是否冻结玩家（对话配置里可单独覆盖）
  freeze_player: true
  # 冻结时是否允许转视角
  allow_rotate: true

# 失败原因文本（会被写入占位符 {fail_reason}）
failure_reasons:
  death: '你死亡了'
  timeout: '超出时限'
  forbidden_region: '进入禁区'
  too_many_kills: '击杀数超标'
  left_quest_area: '离开了任务区域'
  manual: '手动判定失败'

# 消息文本（支持 & 颜色代码与 {占位符}）
messages:
  prefix: '&8[&6任务&8] &r'
  quest_accepted: '&a已接受任务：&f{quest_name}'
  quest_complete_msg: '&a任务完成：&f{quest_name}'
  quest_failed: '&c任务失败：&f{quest_name} &7（{fail_reason}）'
  quest_abandoned: '&7已放弃任务：&f{quest_name}'
  # 禁止放弃的任务被点「放弃」时的提示
  quest_abandon_denied: '&c该任务不允许放弃。'
  # 放弃惩罚扣血时的提示（{amount} 为扣除的生命值点数）
  quest_abandon_penalty_health: '&c放弃任务，扣除 &f{amount} &c点生命值。'
  stage_completed: '&e阶段完成：&f{stage_name}'
  cannot_accept_locked: '&c该任务尚未解锁，请先完成前置任务。'
  cannot_accept_cooldown: '&c该任务冷却中，剩余 &f{time}&c。'
  cannot_accept_limit: '&c已达到{type}并发上限（{limit} 个）。'
  cannot_accept_exclusive: '&c你已选择了互斥的另一个分支。'
  tree_terminated: '&c任务树「{tree_name}」已终结，无法再接取任务。'
  tree_locked: '&c该任务线尚未解锁。'
  tree_unlocked: '&a已解锁新的任务线：&f{tree_name}'
  choice_made: '&a你选择了：&f{choice}'
  choice_locked: '&c该抉择已确定，无法更改。'
  not_in_quest_area: '&c你必须先到达任务区域。'

# 界面设置
gui:
  # 标题格式。可用占位符：
  #   title_quest_list   -> {tree} / {tree_name}、{main}、{main_total}、{side}、{side_total}
  #   title_quest_detail -> {quest} / {quest_name}
  #   title_choice       -> {title}
  # 短名与长名等价，写哪个都行。
  title_tree_list: '&8任务树'
  title_quest_list: '&8任务列表 · {tree}'
  title_quest_detail: '&8任务详情 · {quest}'
  title_choice: '&8[!] 抉择 · {title}'
  # 抉择是否必须按住 Shift 点击才生效（防止误点）
  choice_require_shift: true
  # 图标配置：值为 Oraxen 物品 ID；Oraxen 不可用时回落到内置材质
  icons:
    bg: 'quest_ui_bg'
    prev: 'quest_ui_prev'
    next: 'quest_ui_next'
    close: 'quest_ui_close'
    available: 'quest_ui_available'
    active: 'quest_ui_active'
    done: 'quest_ui_done'
    failed: 'quest_ui_failed'
    locked: 'quest_ui_locked'
    unknown: 'quest_ui_unknown'
    cooldown: 'quest_ui_cooldown'
    choice: 'quest_ui_choice'

# 调试
debug:
  # 接取/完成/失败时是否在控制台打日志
  log_completions: true
  # 是否在 GUI 里显示内部 ID（排查用）
  show_ids_in_gui: false
