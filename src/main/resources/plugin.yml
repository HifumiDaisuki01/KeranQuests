name: KeranQuests
version: ${version}
main: com.keran.quests.KeranQuests
api-version: '1.20'
author: Keran
description: 烛龙探秘 —— 任务系统。任务树 / 阶段 / 抉择 / 循环任务 / GUI / 占位符 / 第三方联动。
website: https://github.com/HifumiDaisuki01
softdepend:
  - PlaceholderAPI
  - MythicMobs
  - WorldGuard
  - WorldEdit
  - Oraxen
  - Citizens
  - Vault
  - LuckPerms
  - ExtractionPoints

commands:
  kq:
    description: 打开任务菜单 / 管理命令
    usage: /kq [list|track|abandon|choice|reload|selftest|debug|help]
    aliases: [keranquests, quests, quest]
    permission: kq.use
    permission-message: '&c你没有权限。'
  ka:
    description: 快速查看当前任务与进度
    usage: /ka [玩家]
    aliases: [kquest, myquest]
    permission: kq.use
    permission-message: '&c你没有权限。'
  kquests:
    description: 第三方插件调用 API
    usage: /kquests <accept|trigger|complete|stage|fail|reset|talk|refresh|query|tree>
    aliases: [kqapi]
    permission: kq.api
    permission-message: '&c该指令仅供第三方插件/控制台调用。'

permissions:
  kq.use:
    description: 允许打开任务菜单、查看/追踪自己的任务
    default: true
  kq.admin:
    description: 允许重载配置、查看他人档案、重置任务
    default: op
  kq.api:
    description: 允许通过 /kquests 操作他人任务（一般只给控制台）
    default: op
  kq.bypass.limit:
    description: 无视主线/支线并发上限
    default: op
