plugins { id 'java' }
group = 'com.keran'
version = '2.0.0'
repositories {
    mavenCentral()
    maven { url = uri('https://repo.papermc.io/repository/maven-public/') }
    maven { url = uri('https://repo.extendedclip.com/content/repositories/placeholderapi/') }
}
configurations { mockitoAgent }
dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.7'
    testImplementation 'io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT'
    testImplementation 'me.clip:placeholderapi:2.11.7'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    mockitoAgent('org.mockito:mockito-core:5.14.2') { transitive = false }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
test { useJUnitPlatform(); jvmArgs "-javaagent:${configurations.mockitoAgent.singleFile}" }
jar {
    archiveBaseName.set('KeranQuests')
    destinationDirectory.set(file("$rootDir/out"))
    manifest { attributes('Implementation-Title': 'KeranQuests', 'Implementation-Version': version) }
}
processResources {
    inputs.property 'version', version
    filesMatching('plugin.yml') { expand(version: version) }
}
