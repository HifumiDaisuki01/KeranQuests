plugins { id 'fabric-loom' version '1.6.12' }
group = rootProject.group
version = rootProject.version
base { archivesName = 'KeranQuests-Client-1.20.1' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1'
}
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
processResources { inputs.property 'version', version; filesMatching('fabric.mod.json') { expand(version: version) } }
remapJar { destinationDirectory.set(file("$rootDir/out")) }
